services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $shortenerBaseUrl: '%env(SHORTENER_BASE_URL)%'

    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Domain/Entity/"
            - "../src/Kernel.php"

    App\Controller\:
        resource: "../src/Controller/"
        public: true
        tags: ["controller.service_arguments"]
